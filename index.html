function alertSearchCard(q){
  var card=document.createElement('div'); card.className='pcard'; card.style.cursor='default'; card.setAttribute('data-qid',q.id);

  var row=document.createElement('div'); row.className='as-row';
  var what=document.createElement('input'); what.className='as-what'; what.placeholder='Role or keywords (e.g. Shopify developer)'; what.value=q.what||'';
  what.onchange=function(){ q.what=what.value; saveLocal(); pushRemote(true); };
  what.onkeydown=function(e){ if(e.key==='Enter'){ q.what=what.value; save(); runAlertSearch(q); } };
  var where=document.createElement('input'); where.className='as-where'; where.placeholder='Location'; where.value=q.where||'';
  where.onchange=function(){ q.where=where.value; saveLocal(); pushRemote(true); };
  var go=document.createElement('button'); go.className='as-go'; go.textContent='Search';
  go.onclick=function(){ q.what=what.value; q.where=where.value; save(); runAlertSearch(q); };
  var del=document.createElement('button'); del.className='as-del'; del.innerHTML='&#10005;'; del.title='Remove search';
  del.onclick=function(){ if(confirm('Remove this search?')){ S.alertSearches=S.alertSearches.filter(function(x){return x.id!==q.id;}); saveLocal(); pushRemote(true); render(); } };
  row.appendChild(what); row.appendChild(where); row.appendChild(go); row.appendChild(del);
  card.appendChild(row);

  var results=document.createElement('div'); results.className='as-results'; results.id='res-'+q.id;
  card.appendChild(results);

  // auto-run if it has a query and hasn't been drawn yet this session
  if(q.what && !alertCache[q.id]) setTimeout(function(){ runAlertSearch(q); },0);
  else if(alertCache[q.id]) drawAlertResults(q, alertCache[q.id]);

  return card;
}

var alertCache = {};   // qid -> {jobs|error} for the session
function runAlertSearch(q){
  var box=document.getElementById('res-'+q.id); if(!box) return;
  if(!q.what){ box.innerHTML='<div class="as-hint">Add a role or keywords, then Search.</div>'; return; }
  box.innerHTML='<div class="as-hint">Searching Adzuna\u2026</div>';
  var u='/api/jobs?what='+encodeURIComponent(q.what)+'&where='+encodeURIComponent(q.where||'')+'&country=au';
  fetch(u).then(function(r){ return r.json(); }).then(function(d){
    alertCache[q.id]=d; drawAlertResults(q,d);
  }).catch(function(){
    alertCache[q.id]={error:'Could not reach the jobs service. Is it deployed?'}; drawAlertResults(q,alertCache[q.id]);
  });
}

function drawAlertResults(q, d){
  var box=document.getElementById('res-'+q.id); if(!box) return;
  box.innerHTML='';
  if(d.needsSetup){
    box.innerHTML='<div class="as-setup"><b>Adzuna key needed.</b> Add ADZUNA_APP_ID and ADZUNA_APP_KEY in Vercel &rsaquo; Settings &rsaquo; Environment Variables, then redeploy. Free key at developer.adzuna.com.</div>';
    return;
  }
  if(d.error){ box.innerHTML='<div class="as-hint">'+d.error+'</div>'; return; }
  var jobs=d.jobs||[];
  if(!jobs.length){ box.innerHTML='<div class="as-hint">No matches right now. Try broader keywords or a wider location.</div>'; return; }

  var changed=false;
  jobs.forEach(function(j){
    var isNew = !S.alertsSeen[j.id];
    var a=document.createElement('a'); a.className='job'+(isNew?' job-new':''); a.href=j.url; a.target='_blank'; a.rel='noopener';
    var t=document.createElement('div'); t.className='job-t';
    t.innerHTML = (isNew?'<span class="job-badge">NEW</span> ':'') + escapeHtml(j.title);
    var m=document.createElement('div'); m.className='job-m';
    m.textContent = j.company + (j.location?(' \u00b7 '+j.location):'') + (j.salary?(' \u00b7 '+j.salary):'') + (j.created?(' \u00b7 '+relDate(j.created)):'');
    a.appendChild(t); a.appendChild(m);
    box.appendChild(a);
    if(isNew){ S.alertsSeen[j.id]=true; changed=true; }
  });
  if(changed) saveLocal();
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function relDate(iso){
  try{ var d=new Date(iso), now=new Date(); var days=Math.floor((now-d)/86400000);
    if(days<=0) return 'today'; if(days===1) return 'yesterday'; if(days<7) return days+'d ago'; return d.toLocaleDateString();
  }catch(e){ return ''; }
}




function render(){
  paintPill();
  renderMenu();

  var top = document.getElementById('top');
  var pagesBar = document.getElementById('pages');
  var bizhead = document.getElementById('bizhead');
  if(bizhead) bizhead.style.display='none';

  // ── 0. still checking sign-in state -> neutral splash (no login flash) ──
  if(fbConfigured() && !authReady){
    top.style.display='none';
    renderSplash();
    return;
  }

  // ── 1. not signed in -> branded landing/login ──
  if(fbConfigured() && !fbUser){
    top.style.display='none';
    renderLanding();
    return;
  }
  // signed in but not on the team
  if(fbUser && !isMember()){
    top.style.display='none';
    renderNotAuthorised();
    return;
  }
  top.style.display='';

  // ── 2. signed in, no business chosen -> business picker ──
  if(!hub){
    document.getElementById('taskChrome').style.display='none';
    pagesBar.style.display='none';
    document.getElementById('headcount').textContent='';
    renderPicker();
    return;
  }

  // ── 3. inside a business ──
  // force allowed hub; PIT only for owner
  if(allowedLaneKeys().indexOf(hub)===-1){ hub=null; return render(); }
  S.filter = hub;                       // scope tasks to this business
  S.lane = hub;                         // capture routes here

  // per-business tabs
  var TABS = {
    gmc:[['tasks','Tasks'],['projects','Projects'],['notifs','Alerts']],
    pit:[['tasks','Tasks'],['grid','Grid']]
  };
  var tabs = TABS[hub] || null;
  if(tabs){
    pagesBar.style.display='';
    pagesBar.innerHTML='';
    tabs.forEach(function(tp){
      var b=document.createElement('button'); b.dataset.page=tp[0]; b.textContent=tp[1];
      if(S.page===tp[0]) b.setAttribute('aria-current','page');
      pagesBar.appendChild(b);
    });
  } else {
    pagesBar.style.display='none';
  }
  // keep S.page valid for this business
  var validPages = (tabs||[['tasks']]).map(function(tp){return tp[0];});
  if(validPages.indexOf(S.page)===-1) S.page='tasks';

  // business header (switch back to picker)
  var bh=document.getElementById('bizhead'); bh.innerHTML=''; bh.style.display='';
  var bhBtn=document.createElement('button'); bhBtn.className='bizback';
  var L = LANE[hub] || {name:hub};
  bhBtn.innerHTML='&#8249; Businesses';
  bhBtn.onclick=function(){ hub=null; S.filter=null; render(); window.scrollTo(0,0); };
  var bhName=document.createElement('span'); bhName.className='bizname'; bhName.textContent = L.name || hub.toUpperCase();
  bh.appendChild(bhBtn); bh.appendChild(bhName);

  document.getElementById('taskChrome').style.display = (S.page==='tasks') ? '' : 'none';

  if(S.page==='projects'){ document.getElementById('headcount').textContent=''; renderProjects(); return; }
  if(S.page==='notifs'){ document.getElementById('headcount').textContent=''; renderNotifs(); return; }
  if(S.page==='grid'){ document.getElementById('headcount').textContent=''; renderGridPage(); return; }

  var dockEl=document.getElementById('dock'); if(dockEl) dockEl.style.display='none';  // business is the scope
  var c=counts();
  document.getElementById('headcount').textContent = c.all + ' open';
  document.getElementById('b-today').textContent = c.today || '';
  document.getElementById('b-upcoming').textContent = c.upcoming || '';
  document.getElementById('b-all').textContent   = c.all   || '';

  document.querySelectorAll('#nav button').forEach(function(b){
    if(b.dataset.view===S.view) b.setAttribute('aria-current','page');
    else b.removeAttribute('aria-current');
  });

  document.getElementById('captureWrap').style.display = '';

  sheet.innerHTML='';

  var _allowed = allowedLaneKeys();
  var pool = S.tasks.filter(function(t){ return _allowed.indexOf(t.lane)!==-1 && inView(t, S.view); });

  if(!pool.length){
    if(S.view==='today') sheet.appendChild(emptyState('Nothing due today','Give an entry a date and it shows up here when it is due. Type one in the bar, ending with a day like "fri" or a date like 25/12.'));
    else if(S.view==='upcoming') sheet.appendChild(emptyState('Nothing scheduled','Dated entries appear here, soonest first, so you can see what is coming.'));
    else sheet.appendChild(emptyState('Empty','Type into the bar above. Toggle Task or Note on the left, tap a lane tile to route it, or write #gmc in the line.'));
    if(S.showLogos) sheet.appendChild(logoPanel());
    updateBadge(); return;
  }

  var grid=document.createElement('div');
  grid.className='grid'+(S.filter?' solo':'');
  visibleLanes().forEach(function(l){
    if(S.filter && l.k!==S.filter) return;
    var t=pool.filter(function(x){ return x.lane===l.k; });
    if(S.view!=='all' && !t.length && !S.filter) return;
    t.sort(cmp);
    grid.appendChild(laneBlock(l,t));
  });
  sheet.appendChild(grid);
  if(S.showLogos) sheet.appendChild(logoPanel());
  updateBadge();
}

/* Downscale to 128px and store as a data URL, so four logos cost a few KB
   instead of blowing the localStorage quota. SVG is stored as-is. */
function setLogo(k, file){
  if(!file) return;
  if(file.size > 4*1024*1024){ alert('That file is over 4MB. Use a smaller export.'); return; }
  var r=new FileReader();
  r.onload=function(){
    if(file.type==='image/svg+xml'){ store(r.result); return; }
    var img=new Image();
    img.onload=function(){
      var max=128, sc=Math.min(max/img.width, max/img.height, 1);
      var c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      store(c.toDataURL('image/png'));
    };
    img.onerror=function(){ alert('Could not read that image.'); };
    img.src=r.result;
  };
  r.onerror=function(){ alert('Could not read that file.'); };
  r.readAsDataURL(file);

  function store(url){
    var prev=S.logos[k];
    S.logos[k]=url;
    try{ localStorage.setItem('docket.v1', JSON.stringify(S)); }
    catch(e){
      S.logos[k]=prev;
      alert('Out of storage. Try a smaller logo file.');
      return;
    }
    render();
  }
}

/* ═══ PIT grid planner ════════════════════════════════════
   Photos live on THIS device only (IndexedDB, localStorage
   fallback) — they never go through Firebase sync.          */
var IGStore = (function(){
  var LS='docket.ig.plan';
  var haveIDB = false;
  try{ haveIDB = !!window.indexedDB; }catch(e){}
  var dbp=null;
  function idb(){
    if(dbp) return dbp;
    dbp=new Promise(function(res,rej){
      var r=window.indexedDB.open('docket-ig',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ rej(r.error); };
    });
    return dbp;
  }
  function lsGet(){ try{ var r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function lsSet(p){ try{ localStorage.setItem(LS, JSON.stringify(p)); return true; }catch(e){ return false; } }
  function get(){
    if(!haveIDB) return Promise.resolve(lsGet());
    return idb().then(function(db){ return new Promise(function(res){
      var rq=db.transaction('kv').objectStore('kv').get('plan');
      rq.onsuccess=function(){ res(rq.result||null); };
      rq.onerror=function(){ res(lsGet()); };
    });}).catch(function(){ return lsGet(); });
  }
  function set(p){
    if(!haveIDB){ return Promise.resolve(lsSet(p)); }
    return idb().then(function(db){ return new Promise(function(res,rej){
      var tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(p,'plan');
      tx.oncomplete=function(){ res(true); }; tx.onerror=function(){ rej(tx.error); };
    });}).catch(function(){ return lsSet(p); });
  }
  return { get:get, set:set };
})();

function igDownscale(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=720, sc=Math.min(max/img.width, max/img.height, 1);
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=function(){ rej('bad image'); };
      img.src=r.result;
    };
    r.onerror=function(){ rej('read error'); };
    r.readAsDataURL(file);
  });
}

    ];

      try{
        var d=JSON.parse(r.result);
        if(!d.tasks) throw new Error('bad file');
        if(confirm('Replace everything currently in Dockit with this file?')){
          S=d; if(!S.notes)S.notes=[]; if(!S.lane)S.lane='aoi'; if(!S.view)S.view='today'; if(!S.page)S.page='tasks'; if(!S.projects)S.projects=[];
          save(); render();
        }
      }catch(err){ alert('That file is not a Dockit export.'); }
    };
    r.readAsText(file);
  };
  f.click();
}
function doClearDone(){
  var n=S.tasks.filter(function(t){return t.done}).length;
  if(!n){ alert('Nothing completed to clear.'); return; }
  if(confirm('Remove '+n+' completed item'+(n>1?'s':'')+'?')){
    S.tasks=S.tasks.filter(function(t){return !t.done}); save(); render();
  }
}

/* ═══ G settings dropdown (corner menu) ═══════════════════ */
function renderMenu(){
  var m=document.getElementById('gmenu');
  if(!m){ m=document.createElement('div'); m.id='gmenu'; document.body.appendChild(m); }
  if(!S.showSync){ m.style.display='none'; m.innerHTML=''; return; }
  m.style.display=''; m.innerHTML='';

  var head=document.createElement('div'); head.className='gmenu-head';
  var t=document.createElement('span'); t.textContent='Settings';
  var x=document.createElement('button'); x.className='gmenu-x'; x.innerHTML='&#10005;'; x.title='Close';
  x.onclick=function(){ S.showSync=false; save(); render(); };
  head.appendChild(t); head.appendChild(x); m.appendChild(head);

  var acct=document.createElement('div'); acct.className='gmenu-acct';
  acct.innerHTML = fbUser ? ('\u2713 Signed in as <b>'+(fbUser.email||'')+'</b>') : 'Working offline on this device';
  m.appendChild(acct);
  if(fbUser){
    var st=document.createElement('div'); st.className='gmenu-status';
    st.textContent = 'Syncing automatically across your devices.';
    m.appendChild(st);
  }

  function item(label, fn, cls){
    var b=document.createElement('button'); b.className='gmenu-item'+(cls?' '+cls:'');
    b.textContent=label; b.onclick=fn; m.appendChild(b);
  }
  if(fbUser) item('Sync now', function(){ pushRemote(true); setSync('sync'); });
  item('Export backup', doExport);
  item('Import backup', doImport);
  item('Clear completed', doClearDone);
  if(fbUser) item('Sign out', function(){ if(confirm('Sign out of Dockit?')) signOut(); }, 'danger');
}

/* ═══ PIT Grid page (owner) ═══════════════════════════════ */
function renderGridPage(){
  sheet.innerHTML='';
  var w=document.createElement('div'); w.className='notif-wrap';
  w.innerHTML =
    '<h2>Instagram grid planner</h2>' +
    '<p>Plan the @logistics_pit feed \u2014 drag photos into a 9-grid, preview the profile, and map out posts before they go live.</p>';
  var open=document.createElement('button'); open.className='gmc-red'; open.style.marginTop='6px'; open.textContent='Open planner';
  open.onclick=function(){ openIG(); };
  w.appendChild(open);
  sheet.appendChild(w);
}

/* ═══ nav ═════════════════════════════════════════════════ */
document.getElementById('nav').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  S.view=b.dataset.view; save(); render();
  window.scrollTo(0,0);
});

/* ═══ page switcher ═══════════════════════════════════════ */
document.getElementById('pages').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  S.page=b.dataset.page; openProject=null; save(); render();
  window.scrollTo(0,0);
});

/* ═══ keyboard (desktop) ══════════════════════════════════ */
document.addEventListener('keydown', function(e){
  var ae = document.activeElement || {};
  var typing = /^(INPUT|TEXTAREA)$/.test(ae.tagName || '');
  if(e.key==='Escape' && typing){ document.activeElement.blur(); return; }
  if(typing) return;
  if(e.key==='n'){ e.preventDefault(); cap.focus(); return; }
  var map={'1':'today','2':'upcoming','3':'all'};
  if(map[e.key]){ S.view=map[e.key]; save(); render(); }
});

render();
initSync();
paintPill();
document.getElementById('syncpill').onclick=function(){
  S.showSync = !S.showSync; if(S.showSync) S.showLogos=false; save(); render();
};

/* ═══ service worker ══════════════════════════════════════ */
if('serviceWorker' in navigator && location.protocol!=='blob:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
